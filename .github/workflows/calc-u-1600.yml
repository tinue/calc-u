# Calc-U-1600 (products/calc-u-1600/): the Qt6 packages for macOS, Windows
# and Linux, the web client (frontends/web/), the help, plus the C++ test
# suite. Every run step works in the product directory.
#
# Run by hand (workflow_dispatch; Actions tab, or `gh workflow run
# calc-u-1600.yml`) — ReleaseIt's `release` dispatches it for a pre-release
# and attaches the artifacts (release.yaml). The Qt6 packages are the
# repository's workflow qt-desktop.yml (the `desktop` job): each made of
# `cmake --install` of build/release, the macOS DMG signed and notarized
# (docs/macos-signing.md: the secrets and their rotation).
#
# ROMs are not in this repository: every job runs roms/fetch_roms.sh
# (roms/README.md) before configuring; without them the build succeeds
# (CMake globs an empty roms/) but the app has no firmware and starts no
# machine. On Linux and Windows the builds fetch libsharpdx too
# (tools/fetch_sharpdx.sh); macOS links the committed one.
#
# Every build configures the repository's root CMake project:
# build/tests (core-tests), build/web (the WebAssembly check and
# frontends/web/build.sh, under Emscripten) and build/release (the Qt6 app
# for packaging, without tests).

name: Calc-U-1600

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: products/calc-u-1600

jobs:
  # The repository's root CMake project with Calc-U-1600 only and
  # without Qt: the harness `calcu` (with the product's entry) and the test
  # programs on top of the calcu1600_core / calcu1600_shared libraries of
  # the product's CMakeLists.txt; the help's checks (tools/help, Python 3 of the
  # runner) run among the tests. This job is
  # the only CI run of the core/ + app/ test suite. The packaging jobs
  # (`desktop`) configure the root too (build/release, CALCU_TESTS off) and
  # build only the GUI app and the harness.
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # No Qt: core/, app/ and the tests build without it. zlib1g-dev is
      # CalcU1600CoreTests' own find_package(ZLIB REQUIRED).
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev

      # CalcU1600CoreTests loads roms/PC-1500_A04.ROM relative to the product
      # directory (which is also the CTest working directory), so this
      # isn't optional here.
      - name: Fetch ROMs
        shell: bash
        run: roms/fetch_roms.sh

      # Vendors core/Basic/vendor/sharpdx/libsharpdx-linux.a from a
      # SharpDataExchange GitHub release: every program loader classifies
      # files through it, and CMake refuses to configure without it.
      - name: Fetch sharpdx
        shell: bash
        run: tools/fetch_sharpdx.sh

      # Optimized: the test suite runs ~3x faster than at -O0.
      - name: Configure (repository root)
        run: >-
          cmake -S ../.. -B ../../build/tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCALCU_PRODUCT_59=OFF -DCALCU_FRONTEND_QT=OFF

      # Builds every target the product defines without Qt -- the harness
      # `calcu` and the test programs -- which is the drift check.
      - name: Build
        run: cmake --build ../../build/tests

      - name: Run tests
        run: ctest --test-dir ../../build/tests --output-on-failure

  library:
    # The library alone, shared with calc-u-59.yml.
    uses: ./.github/workflows/library.yml

  # Core + Shared built for WebAssembly with Emscripten, and a node smoke
  # test running presets cooperatively through the library's app session (no
  # threads, no blocking) -- keeps the frontend-neutral layers portable to
  # a web GUI. Both build in build/web of the root CMake project.
  # Then the web client itself (frontends/web/build.sh), its Playwright
  # tests in Chromium and WebKit (frontends/web/run-tests.sh), then dist/
  # built again with --release (without the test-only commands c1600.upload
  # and c1600.display-text; only SharpWebPart.cpp is compiled again), checked, and
  # zipped as the Calc-U-1600-web artifact (release.yaml attaches it). libsharpdx-wasm.a
  # is committed (tools/build_sharpdx_wasm.sh), so no Rust toolchain is
  # needed here. Same Emscripten as it was built with: Rust's
  # wasm32-unknown-emscripten std uses native wasm exceptions.
  web:
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image: Chromium, WebKit and their system
    # libraries are in it (/ms-playwright), so no `playwright install
    # --with-deps`. Its tag is the Playwright version the three
    # package-lock.json files lock (tools/check_toolchain_versions.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    # In a container, run steps default to sh; bash as on the runner. A job's
    # defaults replace the workflow's, so the product directory again.
    defaults:
      run:
        shell: bash
        working-directory: products/calc-u-1600
    steps:
      - uses: actions/checkout@v5

      # The checkout belongs to another user than the container's root; without
      # this git refuses it and dist/MANIFEST.json's commit is "unknown".
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image lacks these: unzip for setup-emsdk's download, xz for
      # emsdk's archives, zip for the release zip. Root in the container.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build zip unzip xz-utils

      - uses: mymindstorm/setup-emsdk@v16
        with:
          # The release the build images run (7.x does not); one version
          # everywhere (tools/check_toolchain_versions.sh), not the local
          # toolchain's.
          version: 6.0.13

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch ROMs
        shell: bash
        run: roms/fetch_roms.sh

      - name: Build and run the WebAssembly smoke test
        shell: bash
        run: tools/build_wasm_check.sh

      - name: Build the web client
        shell: bash
        run: frontends/web/build.sh

      - name: Install Playwright
        working-directory: products/calc-u-1600/frontends/web
        run: npm ci --no-audit --no-fund

      - name: Test the web client
        shell: bash
        run: frontends/web/run-tests.sh --reporter=line

      # The library's Web frontend shell: its test product,
      # built in the same build/web with this workflow's Emscripten, and its
      # Playwright tests in Chromium and WebKit, the container's browsers.
      # Here only, not in calc-u-59.yml too: once per pipeline, as in
      # ci/linux/jobs.sh (web-1600).
      - name: Test the library's Web frontend shell
        working-directory: library/web
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          tests/run-tests.sh --reporter=line

      - name: Build the release web client
        shell: bash
        run: |
          frontends/web/build.sh --release
          tests/web_no_test_aids.sh frontends/web/dist

      - name: Package the web client
        shell: bash
        run: |
          version=$(sed -n 's/^set(APP_VERSION "\(.*\)")/\1/p' frontends/qt6/CMakeLists.txt)
          (cd frontends/web/dist && zip -qr "../../../Calc-U-1600-web-${version}.zip" .)

      - name: Upload the web client
        uses: actions/upload-artifact@v6
        with:
          name: Calc-U-1600-web
          path: products/calc-u-1600/Calc-U-1600-web-*.zip

  # The help asset Calc-U-1600-help.zip: tools/help
  # (Python 3, standard library only; the runner's python3) checks the help
  # (library/help/ and help/) and builds the zip with the version of
  # frontends/qt6/CMakeLists.txt; release.yaml attaches it.
  help:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Build the help asset
        run: python3 tools/help build calc-u-1600 --out build/help --quiet-warnings

      - name: Upload the help asset
        uses: actions/upload-artifact@v6
        with:
          name: Calc-U-1600-help
          path: build/help/Calc-U-1600-help.zip

  desktop:
    # The Qt6 app packaged for Linux, macOS and Windows; shared with
    # calc-u-59.yml. The buzzer needs Qt Multimedia.
    uses: ./.github/workflows/qt-desktop.yml
    with:
      product: calc-u-1600
      app: Calc-U-1600
      target: CalcU1600Qt
      cmake-options: -DCALCU_PRODUCT_59=OFF
      apt-packages: qt6-multimedia-dev
      qt-modules: qtmultimedia
      prepare: SHARPDX_PLATFORM="$CALCU_PLATFORM" tools/fetch_sharpdx.sh
    secrets: inherit
