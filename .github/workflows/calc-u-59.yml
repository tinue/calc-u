# Calc-U-59 (products/calc-u-59/): the Qt6 packages for macOS, Windows and
# Linux, the web client (frontends/web/), the help, plus the C++ test suite.
# Every run step works in the product directory.
#
# Run by hand (workflow_dispatch) — ReleaseIt's `release` dispatches it for a
# pre-release and attaches the artifacts (release.yaml). The Qt6 packages
# are the repository's workflow qt-desktop.yml (the `desktop` job): each made
# of `cmake --install` of build/release, the macOS DMG signed and notarized
# (docs/macos-signing.md: the secrets and their rotation).
#
# ROMs are not in this repository: every job fetches them with
# roms/fetch_roms.sh from tinue/TI-59-ROM and checks their md5; the Qt build
# compiles them in as resources.
#
# Every build configures the repository's root CMake project:
# build/tests (core-tests), build/web (frontends/web/build.sh, under
# Emscripten) and build/release (the Qt6 app for packaging, without tests).

name: Calc-U-59

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: products/calc-u-59

jobs:
  core-tests:
    # core/ + app/ + tests from the repository's root CMake project with
    # Calc-U-59 only, without Qt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3
      - name: Fetch ROMs
        shell: bash
        run: roms/fetch_roms.sh
      - name: Configure
        run: >-
          cmake -S ../.. -B ../../build/tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCALCU_PRODUCT_1600=OFF -DCALCU_FRONTEND_QT=OFF
      - name: Build
        run: cmake --build ../../build/tests
      - name: Run tests
        run: ctest --test-dir ../../build/tests --output-on-failure

  library:
    # The library alone, shared with calc-u-1600.yml.
    uses: ./.github/workflows/library.yml

  web:
    # frontends/web/build.sh into frontends/web/dist/ (the engine is the
    # root project's calcu59_web target, built in build/web), the
    # Playwright tests against it, and the same dist/ zipped (Calc-U-59 has no
    # test-only command to leave out of a release; docs/developer/Web-Client.md).
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image: Chromium, WebKit and their system
    # libraries are in it (/ms-playwright), so no `playwright install
    # --with-deps`. Its tag is the Playwright version the three
    # package-lock.json files lock (tools/check_toolchain_versions.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    # In a container, run steps default to sh; bash as on the runner. A job's
    # defaults replace the workflow's, so the product directory again.
    defaults:
      run:
        shell: bash
        working-directory: products/calc-u-59
    steps:
      - uses: actions/checkout@v5
      # The checkout belongs to another user than the container's root; without
      # this git refuses it and dist/MANIFEST.json's commit is "unknown".
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image lacks these: unzip for setup-emsdk's download, xz for
      # emsdk's archives, zip for the release zip. Root in the container.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build zip unzip xz-utils
      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v16
        with:
          # The release the build images run (7.x does not); one version
          # everywhere (tools/check_toolchain_versions.sh), not the local
          # toolchain's.
          version: 6.0.13
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch ROMs
        shell: bash
        run: roms/fetch_roms.sh
      - name: Build
        run: frontends/web/build.sh
      - name: Install Playwright
        working-directory: products/calc-u-59/frontends/web
        run: npm ci --no-audit --no-fund
      - name: Test
        run: frontends/web/run-tests.sh
      - name: Zip dist/
        run: |
          set -euo pipefail
          # The version build.js read from MARKETING_VERSION, as the Qt build does.
          VERSION=$(node -p 'require("./frontends/web/dist/MANIFEST.json").version')
          (cd frontends/web/dist && zip -qr "$GITHUB_WORKSPACE/Calc-U-59-web-$VERSION.zip" .)
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Calc-U-59-web
          path: Calc-U-59-web-*.zip
          if-no-files-found: error

  desktop:
    # The Qt6 app packaged for Linux, macOS and Windows; shared with
    # calc-u-1600.yml.
    uses: ./.github/workflows/qt-desktop.yml
    with:
      product: calc-u-59
      app: Calc-U-59
      target: CalcU59Qt
      cmake-options: -DCALCU_PRODUCT_1600=OFF
    secrets: inherit

  # The help asset Calc-U-59-help.zip: tools/help
  # (Python 3, standard library only; the runner's python3) checks the help
  # (library/help/ and help/) and builds the zip with the version of the
  # Xcode project's MARKETING_VERSION; release.yaml attaches it.
  help:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Build the help asset
        run: python3 tools/help build calc-u-59 --out build/help --quiet-warnings

      - name: Upload the help asset
        uses: actions/upload-artifact@v6
        with:
          name: Calc-U-59-help
          path: build/help/Calc-U-59-help.zip
          if-no-files-found: error
