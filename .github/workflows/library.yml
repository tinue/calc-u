# The library alone, without the code of either product: calcu_library and
# calcu_library_tests from the repository's root CMake project, which
# shows that the library builds and passes its tests without a product.
#
# Both product workflows (calc-u-59.yml, calc-u-1600.yml) call it
# as their `library` job, so a release run of either product still runs the
# library's tests. It can also be dispatched on its own to check a change to
# the library alone.

name: Library

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/library -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCALCU_PRODUCT_59=OFF -DCALCU_PRODUCT_1600=OFF -DCALCU_FRONTEND_QT=OFF
      - name: Build
        run: cmake --build build/library
      - name: Run tests
        run: ctest --test-dir build/library --output-on-failure
