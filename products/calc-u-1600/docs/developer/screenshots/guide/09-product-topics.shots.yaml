# Help, chapter 9 Product topics (BASIC programs, the cassette, machine code). Format: docs/developer/screenshots/README.md.
out: ../../../../help/images
window: 1430x1000

shots:
  # Listing after the load -- PRO mode on purpose.
  - name: 04-hanoi-listed
    preset: ../presets/pc1600-hanoi-list.pc1600
    capture: { target: lcd, file: 04-hanoi-listed.png }

  - name: 04-hanoi-running
    preset: ../presets/pc1600-hanoi-run.pc1600
    capture: { target: lcd, file: 04-hanoi-running.png }

  # Cassette: CSAVE records onto the blank tape, Name & Save keeps it under
  # a name; then the cassette picked from the list plays into CLOAD. The
  # shot run starts with an empty cassette folder, so it records first. The
  # pictures mid-transfer come after fixed times; the ends are wait-idle.
  - name: 04-tape
    window: 1760x1000   # the cassette controls widen the PC-1600 control bar
    preset: ../presets/pc1600-tape.pc1600
    steps:
      - select: media-picker-cassette = Blank
      - type: CSAVE "HELLO"
      - run: 6
      - capture: { target: control-bar, file: 04-tape-recording.png, padding: 4 }
      - wait-idle
      - click: media-save-cassette
      - enter-text: Hello
      - capture: { target: dialog, file: 04-tape-save.png }
      - accept
      - key: mode
      - type: NEW0
      - key: mode
      - select: media-picker-cassette = Hello
      - type: CLOAD
      - run: 5
      - capture: { target: control-bar, file: 04-tape-loading.png, padding: 4 }
      - wait-idle
    capture: { target: lcd, file: 04-tape-loaded.png }

  # A file without a header: the app asks where it goes.
  - name: 06-start-address
    window: 900x1000
    preset: ../presets/pc1500a-ready.pc1500a
    steps:
      - action: File > Load Machine Code…
      - choose-file: ../../../../examples/machine-code/memtest_1500a.bin
    capture: { target: dialog, file: 06-start-address.png }

  # A file with a PC-1600 header: loaded straight away, then the advice.
  - name: 06-loaded
    window: 1430x1000
    preset: ../presets/pc1600-ready.pc1600
    steps:
      - action: File > Load Machine Code…
      - choose-file: ../../../../examples/machine-code/CALCULAT.BIN
    capture: { target: dialog, file: 06-loaded.png }
