# Settings ▸ Debugger has
# the server's status line and Disconnect, which can be used while a client
# is connected. The app runs with `--dap 32177` (CMakeLists.txt); a client of
# this process connects and is sent away with Disconnect. A check scenario
# (CalcU1600Shots.debugger-settings-disconnect, Longer); format:
# docs/developer/screenshots/README.md.
out: ../../build/shots-check/debugger-settings-disconnect
window: 1430x1280

shots:
  - name: debugger-settings-disconnect
    steps:
      - action: File > Settings…
      - settle: 300
      - expect-widget: { name: debug-status, text: "Listening on 127.0.0.1:32177" }
      - expect-widget: { name: debug-disconnect, enabled: false }
      - dap-client: 32177
      - settle: 300
      - expect-widget: { name: debug-status, text: "Client connected on 127.0.0.1:32177" }
      - expect-widget: { name: debug-disconnect, enabled: true }
      - click: debug-disconnect
      - settle: 300
      - expect-widget: { name: debug-status, text: "Listening on 127.0.0.1:32177" }
      - expect-widget: { name: debug-disconnect, enabled: false }
      - dap-client: disconnect
      - close
