# LIB-10 AC-41 (design §10.10, D16-7; ADR 0032): a paused machine shows
# "Paused (debugger)" in the window's title, and Machine ▸ Resume runs it
# again. A check scenario (CalcU1600Shots.lib10-ac41, Longer); format:
# docs/developer/screenshots/README.md.
out: ../../build/shots-check/lib10-ac41
window: 1430x1280

shots:
  - name: lib10-ac41
    steps:
      - expect-title: Calc-U-1600
      - command: pause
      - expect-title: Calc-U-1600 — Paused (debugger)
      - action: Machine > Resume
      - settle: 300
      - expect-title: Calc-U-1600
