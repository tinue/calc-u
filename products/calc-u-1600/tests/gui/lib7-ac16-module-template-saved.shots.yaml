# LIB-7 AC-16 (Calc-U-1600 AC-45; design §10.6 P8; ADR 0032): a module
# template (CE-1600M) is chosen in slot 1 and saved under a name with Name &
# Save; afterwards the slot holds that instance, picked from its picker's
# instances (a step that fails when it is not listed). A check scenario
# (CalcU1600Shots.lib7-ac16-module-template-saved, Longer); format:
# docs/developer/screenshots/README.md.
out: ../../build/shots-check/lib7-ac16
window: 1430x1000

shots:
  - name: lib7-ac16
    preset: ../../docs/developer/screenshots/presets/pc1600-ready.pc1600
    steps:
      - select: media-picker-slot-1 = CE-1600M
      - run: 2
      - click: media-save-slot-1
      - enter-text: My programs
      - accept
      - run: 1
      - select: media-picker-slot-1 = My programs
    capture: { target: control-bar, file: lib7-ac16-saved.png, padding: 4 }
