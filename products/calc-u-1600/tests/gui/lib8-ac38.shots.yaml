# LIB-8 AC-38 (design §10.6, P16-7; ADR 0032): a plotter example is loaded,
# and the paper panel appears under the plotter's name with marks on it. A
# check scenario (CalcU1600Shots.lib8-ac38, Longer); format:
# docs/developer/screenshots/README.md.
out: ../../build/shots-check/lib8-ac38
window: 1430x1280

shots:
  - name: lib8-ac38
    preset: ../../examples/plotter/lissajou-1600.pc1600
    steps:
      - expect-panel: { name: paper-panel, title: CE-1600P, empty: false }
      - capture: { target: paper-panel, file: lib8-ac38-paper.png }
      - capture: { target: plot, file: lib8-ac38-copy.png }
