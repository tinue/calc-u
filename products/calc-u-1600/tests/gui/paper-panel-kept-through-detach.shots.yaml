# The paper panel is always
# shown, with the plotter's name while one is plugged in, and the CE-150's
# paper is kept through a detach. A check scenario (CalcU1600Shots.paper-panel-kept-through-detach,
# Longer); format: docs/developer/screenshots/README.md.
out: ../../build/shots-check/paper-panel-kept-through-detach
window: 1430x1280

shots:
  - name: paper-panel-kept-through-detach
    steps:
      # The start: a PC-1500A without a plotter, the panel there and unnamed.
      - expect-panel: { name: paper-panel, title: "", empty: true }
      - action: Machine > Peripherals > CE-150
      - settle: 300
      # The attach replies when the machine is ready for keys: by
      # then the CE-150's power-on has fed the paper, so it is not empty.
      - expect-panel: { name: paper-panel, title: CE-150 }
      - key: cl
      - type: NEW0
      - type: LPRINT 123
      - run: 4
      - expect-panel: { name: paper-panel, title: CE-150, empty: false }
      # A detach: the panel stays, without a name; the paper is kept.
      - action: Machine > Peripherals > CE-150
      - settle: 300
      - expect-panel: { name: paper-panel, title: "" }
      - action: Machine > Peripherals > CE-150
      - settle: 300
      - expect-panel: { name: paper-panel, title: CE-150, empty: false }
      - capture: { target: paper-panel, file: paper-panel-kept-through-detach-paper.png }
