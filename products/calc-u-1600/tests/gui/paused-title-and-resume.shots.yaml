# A paused machine shows
# "Paused (debugger)" in the window's title, and Machine ▸ Resume runs it
# again. A check scenario (CalcU1600Shots.paused-title-and-resume, Longer); format:
# docs/developer/screenshots/README.md.
out: ../../build/shots-check/paused-title-and-resume
window: 1430x1280

shots:
  - name: paused-title-and-resume
    steps:
      - expect-title: Calc-U-1600
      - command: pause
      - expect-title: Calc-U-1600 — Paused (debugger)
      - action: Machine > Resume
      - settle: 300
      - expect-title: Calc-U-1600
