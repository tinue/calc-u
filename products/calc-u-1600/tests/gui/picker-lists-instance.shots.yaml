# After a module
# template was saved under a name (Name & Save), the picker of that slot
# lists it among the instances -- after the templates and a separator, before
# the modules that are not media. The run's save folder starts empty, so the
# instance is made first. A check scenario
# (CalcU1600Shots.picker-lists-instance, Longer); format:
# docs/developer/screenshots/README.md.
out: ../../build/shots-check/picker-lists-instance
window: 1430x1000

shots:
  - name: picker-lists-instance
    preset: ../../docs/developer/screenshots/presets/pc1600-ready.pc1600
    steps:
      - select: media-picker-slot-1 = CE-1600M
      - run: 2
      - click: media-save-slot-1
      - enter-text: My programs
      - accept
      - run: 1
      - select: media-picker-slot-1 = CE-1600M
      - run: 2
      - open: media-picker-slot-1
      - capture: { target: control-bar, file: picker-lists-instance-picker.png, padding: 4 }
      - close
      - select: media-picker-slot-1 = My programs
    capture: { target: control-bar, file: picker-lists-instance-instance.png, padding: 4 }
