# The host's SHIFT tapped alone,
# pressed and let go within 400 ms, is one press of the machine's SHIFT:
# the next key types its second legend (SHIFT + 1 is ' on the PC-1600), as
# the Web's typing.spec.js checks, and only that key. Held longer, or with
# a key in between, it presses nothing. The key events go to the window as the host's
# keyboard gives them. A check scenario (CalcU1600Shots.shift-tap-types-second-legend, Longer);
# format: docs/developer/screenshots/README.md.
out: ../../build/shots-check/shift-tap-types-second-legend
window: 1430x1280

shots:
  - name: shift-tap
    preset: ../../docs/developer/screenshots/presets/pc1600-ready.pc1600
    steps:
      - key: cl
      - host-key-down: shift
      - host-key-up: shift
      - run: 0.5
      - host-key-down: "1"
      - host-key-up: "1"
      - run: 0.5
      - host-key-down: "1"
      - host-key-up: "1"
      - run: 0.5
      # One press: the first 1 is ', the second a 1 again.
      - expect-lcd: "'1"
  # Held past 400 ms: no tap, the 1 is a 1.
  - name: shift-held
    steps:
      - key: cl
      - host-key-down: shift
      - settle: 600
      - host-key-up: shift
      - run: 0.5
      - host-key-down: "1"
      - host-key-up: "1"
      - run: 0.5
      - host-key-down: "1"
      - host-key-up: "1"
      - run: 0.5
      - expect-lcd: "11"
      - expect-no-lcd: "'"
  # SHIFT used as a modifier (a key in between): no tap after it.
  - name: shift-modifier
    steps:
      - key: cl
      - host-key-down: shift
      - host-key-down: "a"
      - host-key-up: "a"
      - host-key-up: shift
      - run: 0.5
      - host-key-down: "1"
      - host-key-up: "1"
      - run: 0.5
      - expect-lcd: "A1"
      - expect-no-lcd: "'"
