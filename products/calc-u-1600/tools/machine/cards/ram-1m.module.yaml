format: memory-module
format-version: 1
# ram-1m -- a test card: 1 MB of battery-backed RAM for the PC-1600's
# Slot 2, in 32 vertical banks of 32 KB.
#
# Not a real module: the bundled superRAM's definition (16 banks, latch D0-D3)
# with the latch widened to D0-D4 and 32 banks fitted.
# The superRAM tests run on it as the card of their 1 MB mode.
#
#   * Vertical bank: `OUT (28H), A` latches the data bus; D0-D4 give
#     the bank number 0-31, which picks the 32 KB behind 8000-BFFF.
#   * Half-select: PVOUT (pin 5, the host's Port 31H b4) picks the low or
#     high 16 KB of the current bank.
#   * RAM1 (pin 4) is the module's enable, gated by the host to 8000-BFFF.
#   * Slot 2 only: the Port 28H strobe has no wiring on Slot 1.
#
# Bank 0 can be expansion or program memory; banks 1-31 are for the RAM
# disk, which the PC-1600's INIT"S2:","F" formats. Ships blank, without a
# module header.

module-name: "ram-1m"
template: true   # read-only starting point; Name & Save copies it
compatible-hosts: [PC-1600-Slot-2]
definition-terminology: PC-1600-Slot-2
battery: true

regions:
  - name: vram-1m
    pc1600-module-class: plain-ram-no-header
    content:
      kind: regular
      writable: true
      power-up-fill: 0x00
    # Region-level "is this a banked access at all" -- a pure gate, no
    # span/maps-to. The module's whole enable is RAM1 (host-gated to the
    # 8000-BFFF window); the real slice mapping lives in bank-window.
    addressing:
      chip-select: RAM1
    banking:
      latch:
        type: trigger-based
        trigger: { io-port: 0x28 }         # OUT (28H) -- the Port 28H vertical-bank write
        sampled-lines: [D0, D1, D2, D3, D4]    # bank number = the byte written (first line = LSB)
        source-domain: data
      bank-count: 32                        # 32 x 32 KB vertical banks = 1 MB
      bank-size: 0x8000                     # 32 KB per vertical bank (Z-80 Bank 2 + Bank 3)
      bank-window:
        any-of:
          # PVOUT low -> low 16 KB half of the current 32 KB bank.
          - all-of:
              - chip-select: RAM1
              - signal-negated: PVOUT
            span: 0x4000
            maps-to: 0x0000
          # PVOUT high -> high 16 KB half.
          - all-of:
              - chip-select: RAM1
              - signal: PVOUT
            span: 0x4000
            maps-to: 0x4000
