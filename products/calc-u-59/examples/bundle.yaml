# What Calc-U-59 bundles from examples/ (docs/formats/bundle.md; C59-2
# AC-13, AC-14): the three startup presets, and the examples the Web
# frontend offered in 2.3.0, in today's order within the groups of C59-2
# OQ-3 (fastmode-sst last of "Programs", behaviour change 59-26). Every
# distribution (Qt6, Swift, Web) bundles exactly the files listed here.
# globe-print.ti59, the fourth printer picture, came back with the magnetic
# cards of C59-7 (M-55): the Web offers ten examples, as 2.3.0 did.

format: example-bundle
format-version: 1
startup:
  - preset: { file: startup/default-ti59.ti59 }
  - preset: { file: startup/default-ti58.ti58 }
  - preset: { file: startup/default-ti58c.ti58c }
groups:
  - group: Diagnostics
    examples:
      - preset: { file: diag.ti59 }
      - preset: { file: diag.ti58 }
      - preset: { file: ram_test.ti59 }
  - group: Programs
    examples:
      - preset: { file: sum.ti59 }
      - preset: { file: characters.ti59 }
      - preset: { file: fastmode-sst.ti59 }
  - group: Printer pictures
    examples:
      - preset: { file: printer-interrupt.ti59 }
      - preset: { file: picard.ti59 }
      - preset: { file: switzerland.ti59 }
      - preset: { file: globe-print.ti59 }
