# Release configuration for ReleaseIt's `release` command
# (https://github.com/tinue/ReleaseIt).
#
#   release                 pre-release calc-u-59-v<version>-pre (also writes
#                           appstore/whatsnew.txt from the CHANGELOG)
#   release --rc            release candidate (dates the CHANGELOG entry)
#   release --release       promote to calc-u-59-v<version> in place
#   release --next          start the next version on main (cuts no branch)
#   release ios             iOS TestFlight upload
#   release ios --release   App Store Connect: metadata, screenshots, build
#
# The desktop and web builds are not built locally:
# .github/workflows/calc-u-59.yml (repository root; dispatched, no publish
# job of its own) builds the Qt6 app for macOS (a signed, notarized DMG),
# Windows and Linux, the web client and the help, and their artifacts go
# into the pre-release. Only the iOS app (`release ios`) is built locally,
# by Xcode. The web client's zip (frontends/web/dist/ of
# `frontends/web/build.sh`; docs/developer/Web-Client.md) has a fixed asset name, so the website's build
# fetches it by tag (releases/download/calc-u-59-v<version>/Calc-U-59-web.zip;
# never releases/latest, as the products' releases are not "Latest"); its
# MANIFEST.json names the version and commit.

name: Calc-U-59
# One of the products of tinue/calc-u: prefixed tags, releases
# from main, never GitHub's "Latest".
tag_prefix: calc-u-59-
branching: trunk
maintenance_branches: ["calc-u-59/*.x"]

version:
  preset: xcode
  file: frontends/swift/Calc-U-59.xcodeproj/project.pbxproj

release:
  latest: false
  # GitHub Releases doesn't keep Unix file permissions on uploaded assets.
  notes_suffix: >-
    **Linux**: the downloaded .AppImage needs its executable bit set before it
    will run — GitHub Releases doesn't preserve file permissions on uploaded
    assets. Run `chmod +x Calc-U-59-*.AppImage` once after downloading, then
    launch it directly. **Windows**: the installer is unsigned.

build:
  - kind: github-dispatch
    workflow: calc-u-59.yml
    artifacts:
      - { artifact: Calc-U-59-linux-x86_64,   file: "Calc-U-59-*.AppImage",       as: Calc-U-59-linux-x86_64.AppImage, executable: true }
      - { artifact: Calc-U-59-linux-aarch64,  file: "Calc-U-59-*.AppImage",       as: Calc-U-59-linux-aarch64.AppImage, executable: true }
      - { artifact: Calc-U-59-mac-aarch64,    file: Calc-U-59.dmg,                as: Calc-U-59-mac-aarch64.dmg }
      - { artifact: Calc-U-59-windows-x86_64, file: Calc-U-59-Setup.exe,          as: Calc-U-59-windows-x86_64.exe }
      - { artifact: Calc-U-59-windows-arm64,  file: Calc-U-59-Setup-arm64.exe,    as: Calc-U-59-windows-arm64.exe }
      - { artifact: Calc-U-59-web,            file: "Calc-U-59-web-*.zip",        as: Calc-U-59-web.zip }
      # The help: the Markdown chapters, their pictures, the tutorial
      # presets and toc.json (tools/help build calc-u-59); calc-u.org/59/
      # renders it.
      - { artifact: Calc-U-59-help,           file: Calc-U-59-help.zip,           as: Calc-U-59-help.zip }

appstore:
  worktree: appstore
  bundle_id: ch.erzberger.calcu59
  export_options: bin/AppStoreExportOptions.plist
  # The App Store notes are for the iOS app: CHANGELOG lines about the other
  # clients carry <!-- appstore: skip --> (ReleaseIt README).
  notes_forbidden: [Windows, Linux, Qt, AppImage, Android]
